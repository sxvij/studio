# /etc/nginx/sites-available/studio in CT 114. The studio on 127.0.0.1:8120; cloudflared publishes it as studio.sxvij.com.
# Every request is checked by studio-gate (access_gate.py, 127.0.0.1:8121): through Cloudflare a valid Access token is
# required (fails closed); local requests are allowed. /api goes to the studio service (127.0.0.1:8122).
server {
  listen 127.0.0.1:8120 default_server;
  server_name studio.sxvij.com;
  root /opt/studio/www;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;
  client_max_body_size 40m;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  auth_request /_access;
  location = /_access {
    internal;
    proxy_pass http://127.0.0.1:8121/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8122;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    proxy_buffering off;
  }
  location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
  location ~ /\. { deny all; }
}
